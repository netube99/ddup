    line: 1326
    note: '原重复回报双增数量已修复；本轮发现同一身份内容校验遗漏成交日期。触发：已记录sim/T1在20240108买100股@10，再以20240109回报同ID及相同数量价格。复现：.venv/bin/python -m pytest tests/test_live_plan.py -k same_trade_id_different_content -q。实际：静默no-op，1 passed/1 failed；独立期望：不同日期属异内容，明确拒绝且保留原事实。影响：计划回报入口隐瞒日期冲突，破坏账户身份契约。'
  - id: LIVE-V2-06
    severity: P1
    rule: docs/live_redesign.md §6：失败事务不留下半账本/半计划
    file: research/live.py
    line: 163
    note: '触发：对账单含合法入金1000及非法quantity=0成交。复现：.venv/bin/python -m pytest tests/test_live_v2_review.py -k statement_failure -q。实际：首份导入失败仍留下确认快照及入金，后续导入失败仍留下入金；独立期望：整份失败后快照/现金流/审计计数与原状相同，后续账户现金仍为10000。影响：CLI import 和公共门面留下半账本。'
