    note: '触发：statement shares=100.5、available=99.5、delta_shares=1.5 或布尔金额/股数。复现：.venv/bin/python -m pytest tests/test_live_v2_review.py -k lossy -q。实际：分别静默落为100/99/1，True转为1；独立期望：拒绝非法输入且不落快照。影响：CLI及门面绕过账户层严格校验，记入与原始输入不同的事实。'
