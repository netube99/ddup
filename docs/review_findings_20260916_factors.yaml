meta:
  date: 2026-09-16
  scope: 因子库设计审查（217 因子全覆盖，7 个并行子代理 + 主控复核）
findings:
  # ── 主控 lead 发现 ──
  - id: F-FD0-05
    severity: P1
    rule: "AGENTS.md 设计契约：不产生静默错误结果 / 崩溃；docs/factor_library.md §4 纯表达式路径应对任何合法面板产出 NaN"
    file: btcore/factors/expr.py
    line: 90
    note: "事件表在请求窗口内零行时 GenericSQLBackend 返回 object dtype 全 NaN 列（空结果集 dtype 推断），pandas.eval 对这类列抛 TypeError/RecursionError 而非产出 NaN：实测 pledge_detail 空表下 compute_factors(['pledge_risk']) 抛 RecursionError（2026-09-16 探针）；任何纯表达式因子引用窗口内无数据的事件列都会崩溃（如 lhb_*/inst_* 在无上榜窗口）。修复：求值路径统一 coerce_all_nan_object_columns 把 object 全 NaN 列转 float64（expr.evaluate_expr 与 ops.eval_op_expr 两路径），回归测试 test_all_nan_object_columns_do_not_crash。"
  - id: F-FD0-01
    severity: P1
    rule: "docs/factor_library.md §9.2：pct_chg = (close - pre_close) / pre_close（小数口径，非百分数）"
    file: factors/library.yaml
    line: 514
    note: "limit_up_pct 表达式 mean(pct_chg >= 9.8) 阈值量纲错：pct_chg 是小数，9.8 是百分数，比较恒 False。DB 实证 20240930（3185 只涨幅≥9.8%）：SQL AVG((close/pre_close-1)>=9.8)=0.000179；compute_breadth('limit_up_pct') 实测 0.000179，而同日的 limit_down_pct（用小数阈值 -0.095）工作正常（20241009=0.546）。第十四轮注释却记为『+0.061 弱正』——对恒零因子下了结论。"
  - id: F-FD0-02
    severity: P1
    rule: "docs/factor_library.md §12：坍缩算子始终在全市场面板上逐日聚合，候选池大小不影响其值"
    file: factors/library.yaml
    line: 63
    note: "pct_sealed=mean(fd_amount>0) 的广度面板请求列仅 fd_amount → btcore/generic_sql.py:189-192 的网格=各被引用表 (trade_date,symbol) 键外并集，网格退化为 limit_list_d 事件行，全市场分母被静默丢弃（引擎 _preload_breadth 同样按 breadth_columns 请求，engine.py:606-609）。实测 20240923：compute_breadth('pct_sealed')=0.780822（=57/73 事件行内占比），真实全市场封板占比=57/5590=0.010197；同一函数追加 close 请求后即得 0.010197——因子值取决于同批请求的其它列。第十四轮『pct_sealed corr +0.139』择时结论建立在错误口径上。"
  - id: F-FD0-03
    severity: P2
    rule: "adapters/tushare.py extra_fields 是列登记唯一事实源，未登记列运行期拒绝（fail-fast）"
    file: factors/library.yaml
    line: 527
    note: "accrual_z(527) 引用 net_profit/n_cashflow_act，cfo_quality(535) 同，leverage_change(543) 引用 total_liab：三列均未在 adapters/tushare.py extra_fields 登记，实库 PRAGMA table_info(bak_basic) 亦无这些列（只有 total_assets/liquid_assets 等）→ 三个因子不可物化（策略引用即 preload 报错），描述里的『⚠ 需 bak_basic 表含…列』从未落实，属死定义。"
  - id: F-FD0-04
    severity: P2
    rule: "factors/library.yaml:9 顶部通告：本文件所有修正前的 RankIR/分层/衰减数字均失效，需用修复后的 factor_eval 重测"
    file: factors/library.yaml
    line: 9
    note: "评估标注系统性失效：大量段落仍把作废数字写成『★通过/有效/旗舰』，与同文件修正后结论/顶部通告直接互斥。例：winner_rate_z(172『筹码簇真实有效』) vs 通告 -0.11/-0.09；close_vs_cost50(182『0.41/0.48』) vs -0.04/-0.03；cvw_ma5(766『★0.574/0.282 比裸 cvw 强一倍』)与 cvw_chg5/cvw_neutral(774-786) vs -0.06/-0.03；winner_chg20(857『★0.51/0.62』) vs 0.00/0.02；技术指标蒸馏节(261-319)全部 2026-07-27 数字；中性化节(354-373『0.64/0.53/0.54/0.49/0.52』与 mom5『0.83』) vs 重测 mom 族 -0.07~-0.15；基本面节(326-348)与 1276 行符号相反；事件/低拥挤段(377-397/1241-1274)同类。第 15/16 轮『★ 全存活』与 1285-1291『此前通过判定全部撤销』同页并存，读者无法区分有效/作废（策略层后果见 F-FDX-06）。"
  # ── 第 1 组：基础/事件/资金流/筹码/两融/量价 ──
  - id: F-FD1-01
    severity: P1
    rule: "docs/audit_checklist.md D-EXT-02 量纲核对（量纲错不报错、全链路静默错）；adapters/tushare.py:23 amount 注释为千元"
    file: factors/library.yaml
    line: 164
    note: "mf_divergence=(buy_lg_amount-sell_lg_amount)/amount：moneyflow 金额列单位为万元，amount 为千元，资金流项被系统性压低 10 倍。DB 实证 000001.SZ 20240605：moneyflow 四档买单合计 111415.6（万元）= stk_factor_pro.amount 1114156.0（千元）÷10。探针（两日面板 n=5090）：现值与 -roc(close_hfq,5) 相关 0.9944，正确量纲版 0.6236，Spearman(现值,正确值)=0.6576 → 截面排序被改变，『资金流与价格背离』实质退化为 5 日反转；该因子被 strategies/selected/trend_guard_bw_300（weight 0.15）等消费。"
  - id: F-FD1-02
    severity: P2
    rule: "docs/audit_checklist.md D-EXT-02 量纲核对；adapters/tushare.py:23 amount 千元"
    file: factors/library.yaml
    line: 143
    note: "lg_net_rate/elg_net_rate/md_net_rate/total_net_rate/lg_net_ma5/elg_net_ma5（143/146/149/152/155/158）同源：moneyflow 万元 ÷ amount 千元 = 真实占比×0.1。截面排名不受常数缩放影响，但任何绝对阈值（如 where: lg_net_rate > 0.05）静默错 10 倍；lg_net_z 经 zscore 抵消、数值正确。"
  - id: F-FD1-03
    severity: P2
    rule: "factors/library.yaml:51 描述『涨停封单金额/流通市值（封板强度，仅封板日有值）』；adapters/tushare.py:181 limit_flag: U涨停/D跌停/Z炸板"
    file: factors/library.yaml
    line: 49
    note: "limit_list_d 的跌停(D)行 fd_amount/open_times/limit_times 同样有值，where fd_amount>0 不区分 U/D → seal_strength/limit_solidity/sealed_days5 把跌停日计为『涨停封板』。DB 实证 2024 全年：D 行 5881 行全部 fd_amount>0（如 603863.SH 20240605 limit_times=2 且当日 -10.01%），U 行 17761 → 约 25% 的『封板』观测来自跌停；sealed_days5 被 selected/core_lowvol_500 作为评分因子消费，信号含义被静默改写。"
  - id: F-FD1-04
    severity: P2
    rule: "factors/library.yaml:58 描述『连板数（仅上榜日有值，原始事件列）』"
    file: factors/library.yaml
    line: 57
    note: "limit_streak=limit_times 无掩码，而 D(跌停)行 limit_times 为连续跌停天数 → 『2 连板』与『2 连跌停』同值（20240605 实例 603863.SH=2，当日 -10.01%）；Z 行全 NULL。U/D 在因子值上不可区分。"
  - id: F-FD1-05
    severity: P2
    rule: "docs/factor_library.md §10.1 ascending: true=小值排名靠前；§11.4 陷阱三（ascending 语义写反）"
    file: factors/library.yaml
    line: 101
    note: "rev_5d=-roc(close_hfq,5)：expr 高值=过去 5 日输家。描述『买跌卖涨，升序排名』三处互斥：升序（值小优先）选出的是过去涨幅最大者（买涨）；要执行『买跌』须降序（取 -roc 最负）。策略按字面配置会反向，同型见 rev10_z(229) 与 F-FD2-05。"
  # ── 第 2 组：筹码/两融/量价/技术指标 ──
  - id: F-FD2-01
    severity: P1
    rule: "AGENTS.md 设计契约·价格体系：因子计算、排名使用后复权（*_hfq），不可混用；docs/factor_library.md §9.2"
    file: factors/library.yaml
    line: 266
    note: "pct_b/cci_z/macd_golden/macd_z/kdj_golden/pdi_mdi/mfi_z/close_vs_bbi/ema_bullish（266-306）消费 adapters/tushare.py:75-137 注册的 *_bfq（不复权）列，而同表 *_hfq 变体齐全且有值（boll_upper/lower_hfq、cci_hfq、macd_*_hfq、kdj_*_hfq、dmi_*_hfq、mfi_hfq、bbi_hfq、ema_hfq_*，2018 起全量）。除权日实测 000429.SZ 20260810：pct_b_bfq=-0.1933 vs pct_b_hfq=+0.0680（符号相反）；macd_dif_bfq=-0.032 vs hfq=+0.23。261 行注释自述 bfq 口径，属已知契约违背（9 因子中 7 个被策略/ML 消费）。"
  - id: F-FD2-02
    severity: P1
    rule: "因子描述『净买入压力占比（bak_daily 口径）』（占比需同量纲）；docs/backend_guide.md vol 单位为手"
    file: factors/library.yaml
    line: 257
    note: "net_buy_pressure=(bk_buying-bk_selling)/amount = 手 ÷ 千元，异量纲比。DB 实证 000001.SZ 20260916：buying=383663、selling=565963、vol=949626（手），amount=1106652.94（千元）→ 比值 -0.1648 手/千元；跨截面被价格水平污染（高价股比值偏小），不是任何『占比』。"
  - id: F-FD2-05
    severity: P3
    rule: "docs/factor_library.md §11.4 陷阱三（ascending 与 IC 符号）"
    file: factors/library.yaml
    line: 230
    note: "rev10_z=zscore(-roc(close_hfq,10)) 高值=过去 10 日输家；description 同时写『反转』与『升序』互斥（买跌应降序）。与 F-FD1-05 同型。"
  - id: F-FD2-06
    severity: P3
    rule: "AGENTS.md 财报数据对齐契约 + adapters/tushare.py:272-277 注释（stk_holdernumber_agg 按 ann_date 对齐）"
    file: factors/library.yaml
    line: 244
    note: "holder_count 描述『仅定期报告日有值』与数据事实不符：agg 表按 ann_date 对齐；2026 年 ann_date=end_date 行中 end_date 为季末仅 110/18716，样本多为 20260731/20260720 等 → 实为月度级公告快照。无前视，但描述低估披露频率、误导口径判断。"
  - id: F-FD2-07
    severity: P3
    rule: "docs/factor_library.md §8：where 是后置掩码，表达式先完整求值（不保护 where 之前的滚动窗口）"
    file: factors/library.yaml
    line: 200
    note: "margin_ma5=ma(rzmre/rzye,5) 滚动前无分母保护：margin_detail 中 rzye=0 共 204 行（其中 145 行 rzmre>0 → +inf），rolling mean 窗口含 inf 即整窗 NaN，此后 4 日 margin_ma5 静默 NaN；where rzye>0 只掩当日。当前 204 行均为基金代码（不在 stk_factor_pro 股票池），未实际污染，属潜在缺陷。"
  # ── 第 3 组：基本面/中性化/事件/尾部风险/规模/广度 ──
  - id: F-FD3-01
    severity: P1
    rule: "AGENTS.md 软回退 vs Fail-Fast（明确声明的依赖缺失→加载/preload 报错）；factors/library.yaml:1168『pledge_detail/stk_holdernumber 同理解锁——holder_count/pledge_risk 恢复可用』"
    file: factors/library.yaml
    line: 395
    note: "DB 实况：pledge_detail 0 行、pledge_detail_agg 0 行（其它事件表已更新至 20260916），tushare_db/database/etl.py REGISTRY 无 pledge_detail 拉取项 → pledge_p_total_ratio/pledge_h_total_ratio 恒 NaN，pledge_risk 全程全 NaN 且无任何报错；而 379/396 行注释与 1168 行『恢复可用』仍记 RankIC -0.03『方向正确』，与数据实况矛盾。"
  - id: F-FD3-02
    severity: P1
    rule: "adapters/tushare.py:234-236 列登记『机构席位净买入』；factors/library.yaml:384 描述『机构席位净买入』"
    file: factors/library.yaml
    line: 383
    note: "DB top_inst 129347 行 = 129347 个 distinct (ts_code,trade_date)，PK(trade_date,ts_code) 折叠（INSERT OR REPLACE 每股每日只留单席位行），与 tushare top_inst 的逐席位多行语义不符；全表 exalter='机构专用' 仅 15116/129347=11.7%。inst_net_buy/inst_buy_rate 实为『单一任意席位值』而非机构席位合计，因子语义静默错误（inst_net_buy_z/inst_buy_pct 均为低信号保留区，但描述错误）。"
  - id: F-FD3-03
    severity: P1
    rule: "因子描述声明『20日收益偏度 / 超额峰度（矩展开近似）』；docs/audit_checklist.md FA-OP-02（分母/NaN 语义）"
    file: factors/library.yaml
    line: 444
    note: "ret_kurt20/ret_skew20 分母保护项 1e-4 与 std^4/std^3 量级失配：DB 实测日收益 std 0.0165-0.0291 → std^4=9.1e-8~7.2e-7，1e-4 大 139~1100 倍，对绝大多数个股近似常数 → ret_kurt20≈m4/1e-4-3（由四阶矩/波动尺度主导）而非峰度；ret_skew20 同型（std^3 仅占 1e-4 的 2%~20%，偏度被常数压缩）。对比 sharpe_20 的 1e-4（分母 std 量级 1e-2）合理，可见幂次后未同步缩放 epsilon。"
  - id: F-FD3-04
    severity: P3
    rule: "factors/library.yaml:431 注释（EDGE-14）对布尔掩码 NaN 行为的方向性声明"
    file: factors/library.yaml
    line: 431
    note: "说明写反：ops.py 比较 .astype(float) 把掩码 NaN 变为 0.0，随后 0.0×NaN=NaN（IEEE 语义），warmup 首行 NaN 被保留；实测 roc(close_hfq,1)*(roc(close_hfq,1)<0) 首行输出 NaN，与 min(x,0) 的 NaN 处理一致，不存在描述所称『首行计为 0 收益』的差异。行为正确、文档错误。"
  - id: F-FD3-05
    severity: P2
    rule: "factors/library.yaml:389/392 描述『连板封单量』；adapters/tushare.py:238 kpl_lu_limit_order=连板封单量"
    file: factors/library.yaml
    line: 391
    note: "kpl_lianban 取 kpl_list.lu_limit_order（当日涨停封单量，20240605 量级 3.6e7~9.9e8），kpl_list 表无任何连板数字段（连板数在 limit_list_d.limit_times）→ 因子名承诺『连板数』，实际给的是封单量原始值，『连板封单量』把两个概念混写。"
  - id: F-FD3-08
    severity: P2
    rule: "factors/library.yaml:465 描述『近5日主力净流入天数（0-5）』；docs/audit_checklist.md FA-OP-02（比较式 NaN 语义）"
    file: factors/library.yaml
    line: 464
    note: "ops 比较把 NaN 折为 False→0，源列缺失日被静默计为『非流入』而非未知；实测 sum(dc_net_rate>0,3) 对 [1,NaN,-2] 输出 1（窗口内 1 正 1 负 1 缺失）。moneyflow_dc 仅 2023-09-11 起，此前回测该因子对全部个股恒 0（无截面变异、无告警），描述未标覆盖起点与缺失语义。"
  - id: F-FD3-09
    severity: P3
    rule: "docs/factor_library.md §10.1 ascending 语义（方向标注须与收益方向自洽）"
    file: factors/library.yaml
    line: 441
    note: "ret_skew20 自述『高偏度→低未来收益』却标『降序排名』（应升序）；amihud_illiq(404) 自述『低流动性溢价（升序）』而低流动性溢价通常指高 illiq 高收益（应降序）。与 vol_z/downside_vol20 的自洽写法对照可见不一致。"
  # ── 第 4 组：ML 特征/尾盘/资金流微结构/超额/beta ──
  - id: F-FD4-01
    severity: P1
    rule: "factors/library.yaml:702-704 自述『与 dc_net_rate 区别：net_rate 看净流入，本因子看买盘总量强度（不分卖盘对冲）』；adapters/tushare.py:201-204 登记为『买入占比』"
    file: factors/library.yaml
    line: 700
    note: "moneyflow_dc 的 buy_elg/lg/md/sm_amount_rate 实为分档净流入率（四档对消），不是买入占比：DB 20240603 000001.SZ net_amount_rate=-6.47=elg(-4.0)+lg(-2.47)，md+sm=+6.47；两日 11452 行中 elg+lg≡net（|差|≤0.01）。故 dc_big_buy_rate ≡ dc_net_rate（zscore 版即 hot_money:78），『买盘总量强度』的区分声明为假；dc_sm_buy_z(687)/dc_elg_sm_div(693) 同错，且注释推荐『优先取本因子』→ 组合会双计同一净流入信号。"
  - id: F-FD4-03
    severity: P1
    rule: "docs/factor_library.md §6.1 roc『基准值为 0 处得 NaN』；docs/audit_checklist.md FA-OP-02（NaN/分母语义）"
    file: factors/library.yaml
    line: 606
    note: "roc_decay=roc_3/(roc_10+0.0001)-1 的 epsilon 对负/零分母无效且制造极端值：实测（2023-2024，50 股 24027 行）roc_10==0 共 134 行（0.56%，最小报价单位下的 10 日往返，如 000001.SZ 20240627 vs 20240711 close_hfq 相同），这些行 roc_decay ∈ [-751,+1236.7]，全样本 |roc_decay|>10 占 2.7%；roc_10∈(-1e-4,0) 时还会分母变号。该因子被 docs/devlog/ml_signal_design.md:65 标为核心特征，应显式 NaN/where 而非 epsilon。"
  - id: F-FD4-04
    severity: P2
    rule: "docs/backend_guide.md:292 net_mf_amount（万元）；amount 实库为千元"
    file: factors/library.yaml
    line: 596
    note: "mf_raw=net_mf_amount/(amount+0.0001) 分子分母量纲差 10×（000001.SZ 20240603：-38491.51/1456086.02=-0.0264，同单位应为 -0.2644）；截面排名不受常数缩放影响，但水平值与阈值解读偏小 10 倍，mf_chg 继承。"
  - id: F-FD4-05
    severity: P2
    rule: "库内冗余登记惯例（factors/library.yaml:785-792：close_vs_cost_avg 自述与既有因子 corr 0.97 二选一）；:265 已登记 pct_b"
    file: factors/library.yaml
    line: 580
    note: "bb_position=(close-boll_lower)/(boll_upper-boll_lower+0.0001) 与 pct_b 是同一定义：实测 24027 行 |差| max 8.2e-4（p99 3e-4）。差异仅 pct_b 有 where 掩码无 epsilon、bb_position 无 where 加 1e-4（退化带 upper==lower 时产出极端值）。未标注等价关系 → ML/多因子同时声明即同一特征/信号双计。"
  - id: F-FD4-06
    severity: P2
    rule: "factors/library.yaml:729-733 自述『截面排名 ≡ mom5/mom20』；:37 mom_z 已存在"
    file: factors/library.yaml
    line: 741
    note: "alpha_z5=zscore(alpha_mom5) 恒等于 zscore(mom5)；alpha_z20(743) 恒等于 mom_z(37)——zscore 对逐日截面常数平移不变，alpha_mom* 减 idx_ret 后『市场相对口径更稳健』的保留价值在 z 变换后完全消失；factor_specs 同时引用即同一信号双倍权重。"
