factors:
  mom20:
    expr: "roc(close_hfq, 20)"
    description: "20日动量（后复权）"
  bias20:
    expr: "close_hfq / ma(close_hfq, 20) - 1"
    description: "20日乖离率"
  low_turnover:
    expr: "turnover_rate"
    description: "换手率"
  value:
    expr: "dv_ttm / pb"
    where: "pb > 0"
    description: "股息率/市净率（截面组合示例）"
  mom_z:
    expr: "zscore(mom20)"
    description: "截面标准化动量（候选池口径）"
  industry_mom:
    expr: "group_mean(mom20, industry)"
    description: "行业平均动量（全市场聚合，map 回个股）"
  pct_above_ma20:
    expr: "mean(close_hfq >= ma(close_hfq, 20))"
    description: "站上MA20的股票占比（市场广度，同日截面广播）"

  # ══ 涨跌停 / 龙虎榜 / 大宗交易 / 东财资金流（limit_list_d / top_list /
  #    block_trade / moneyflow_dc 表；事件型数据，未上榜日 = NaN）══
  seal_strength:
    expr: "fd_amount / (circ_mv * 10000)"   # fd_amount 单位元，circ_mv 单位万元
    where: "fd_amount > 0"
    description: "涨停封单金额/流通市值（封板强度，仅封板日有值）"
  limit_solidity:
    expr: "1 / (open_times + 1)"
    where: "fd_amount > 0"
    description: "封板牢固度：打开次数越少越高"
  limit_streak:
    expr: "limit_times"
    description: "连板数（仅上榜日有值，原始事件列）"
  sealed_days5:
    expr: "sum(fd_amount > 0, 5)"
    description: "近5日封板天数（事件计数 = sum(条件, n)）"
  pct_sealed:
    expr: "mean(fd_amount > 0)"
    description: "全市场封板股票占比（市场情绪广度，坍缩口径）"
  lhb_inflow:
    expr: "lhb_net_rate"
    description: "龙虎榜净买入占总成交比（仅上榜日有值）"
  block_premium:
    expr: "bt_price / close - 1"
    where: "bt_amount > 1000"   # bt_amount 单位万元 → 千万级以上
    description: "大宗交易折溢价（千万级以上交易，仅成交日有值）"
  dc_big_money:
    expr: "dc_elg_rate"
    description: "东财超大单买入占比（2023-09 起）"
  dc_inflow_ma5:
    expr: "ma(dc_net_rate, 5)"
    description: "主力净流入占比 5 日平滑"
  hot_money:
    expr: "zscore(dc_net_rate)"
    description: "主力净流入截面标准化（候选池口径）"

  # ══ 多因子策略扩展因子 ══
  vol_20d:
    expr: "std(roc(close_hfq, 1), 20)"
    description: "20日收益率波动率（日收益 std）"
  vol_z:
    expr: "zscore(vol_20d)"
    description: "截面标准化波动率（低波异象，升序排名）"
  ep_ttm:
    expr: "1 / pe_ttm"
    where: "pe_ttm > 0"
    description: "盈利收益率（TTM PE 倒数，仅正 PE 有效）"
  ep_z:
    expr: "zscore(ep_ttm)"
    description: "截面标准化盈利收益率（价值维度）"

  # ══ 短周期反转 ══
  rev_5d:
    expr: "-roc(close_hfq, 5)"
    description: "5日收益率反转（买跌卖涨，升序排名）"

  # ══ Round 3 价值收益因子 ══
  dv_z:
    expr: "zscore(dv_ttm)"
    where: "dv_ttm > 0"
    description: "截面标准化股息率（仅正股息率有效）"
  mom_60d:
    expr: "roc(close_hfq, 60)"
    description: "60日动量（中长期趋势）"
  mom_z_60:
    expr: "zscore(mom_60d)"
    description: "截面标准化 60 日动量"

  # ══ 资金流因子（moneyflow 表；大单/超大单净流向）══
  lg_net_rate:
    expr: "(buy_lg_amount - sell_lg_amount) / amount"
    description: "大单净买入占比（大资金动向）"
  elg_net_rate:
    expr: "(buy_elg_amount - sell_elg_amount) / amount"
    description: "超大单净买入占比（主力资金动向）"
  md_net_rate:
    expr: "(buy_md_amount - sell_md_amount) / amount"
    description: "中单净买入占比"
  total_net_rate:
    expr: "(buy_lg_amount + buy_elg_amount - sell_lg_amount - sell_elg_amount) / amount"
    description: "大单+超大单净买入占比（主力合计）"
  lg_net_ma5:
    expr: "ma((buy_lg_amount - sell_lg_amount) / amount, 5)"
    description: "大单净买入占比 5 日平滑"
  elg_net_ma5:
    expr: "ma((buy_elg_amount - sell_elg_amount) / amount, 5)"
    description: "超大单净买入占比 5 日平滑"
  lg_net_z:
    expr: "zscore((buy_lg_amount - sell_lg_amount) / amount)"
    description: "大单净买入占比截面标准化"
  mf_divergence:
    expr: "(buy_lg_amount - sell_lg_amount) / amount - roc(close_hfq, 5)"
    description: "大单流向与价格背离（正=资金流入但价未涨）"

  # ══ 筹码分布因子（cyq_perf 表）══
  winner_rate_z:
    expr: "zscore(winner_rate)"
    description: "获利盘比例截面标准化（高=获利盘多/压力区，低=套牢盘多/支撑区）"
  cost_concentration:
    expr: "(cost_95pct - cost_5pct) / cost_50pct"
    where: "cost_50pct > 0"
    description: "筹码集中度（值越小越集中）"
  close_vs_cost50:
    expr: "close / cost_50pct - 1"
    where: "cost_50pct > 0"
    description: "收盘价相对筹码中轴位置（正=浮盈，负=浮亏）"
  chip_support:
    expr: "close / cost_85pct - 1"
    where: "cost_85pct > 0"
    description: "距上方重压区距离（负=上方有压力）"

  # ══ 融资融券因子（margin_detail 表）══
  margin_change:
    expr: "rzmre / rzye"
    where: "rzye > 0"
    description: "融资买入占余额比（融资活跃度）"
  margin_balance_z:
    expr: "zscore(rzye / (total_mv * 10000))"
    where: "rzye > 0 and total_mv > 0"
    description: "融资余额占市值比截面标准化（杠杆情绪）"
  margin_ma5:
    expr: "ma(rzmre / rzye, 5)"
    where: "rzye > 0"
    description: "融资活跃度 5 日平滑"

  # ══ 量价因子 ══
  vol_ratio_z:
    expr: "zscore(volume_ratio)"
    description: "量比截面标准化（放量异象）"
  turnover_z:
    expr: "zscore(turnover_rate)"
    description: "换手率截面标准化（低换手异象，升序）"
  amount_z:
    expr: "zscore(amount)"
    description: "成交额截面标准化（流动性）"
  amt_ma5_ratio:
    expr: "amount / ma(amount, 5)"
    description: "成交额相对 5 日均量"

  # ══ 短周期动量/反转 ══
  mom5:
    expr: "roc(close_hfq, 5)"
    description: "5日动量"
  mom10:
    expr: "roc(close_hfq, 10)"
    description: "10日动量"
  mom60:
    expr: "roc(close_hfq, 60)"
    description: "60日动量（同 mom_60d，别名）"
  rev10_z:
    expr: "zscore(-roc(close_hfq, 10))"
    description: "截面标准化 10 日反转（升序）"

  # ══ 波动率 ══
  vol10:
    expr: "std(roc(close_hfq, 1), 10)"
    description: "10日波动率"
  vol60:
    expr: "std(roc(close_hfq, 1), 60)"
    description: "60日波动率"

  # ══ 股东人数因子（stk_holdernumber 表，季度频）══
  holder_count:
    expr: "holder_num"
    where: "holder_num > 0"
    description: "股东人数（仅定期报告日有值）"

  # ══ bak_daily 独有指标 ══
  strength_raw:
    expr: "strength"
    description: "tushare 强度指标（日频）"
  strength_z:
    expr: "zscore(strength)"
    description: "截面标准化强度"
  attack_z:
    expr: "zscore(attack)"
    description: "截面标准化攻击力（量价配合度）"
  net_buy_pressure:
    expr: "(bk_buying - bk_selling) / amount"
    where: "amount > 0"
    description: "净买入压力占比（bak_daily 口径）"
