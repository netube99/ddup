# 示例 5: self_managed_rank — 排名阈值 + 逐仓独立管理
#
# 展示能力：
#   - 策略代码自管理换手：每只持仓独立判断，无固定调仓日
#   - 每只持仓独立跟踪入场日期 + 排名变化
#   - 卖出由 "排名掉出阈值 + 持有够久" 触发（非固定日历调仓）
#   - 买入由 "出现空位" 触发
#   - provider.get_historical_bars() 历史数据查
#
# 模式 B：排名阈值
#   - 换手频率由排名变化速度自然决定，而非固定间隔
#   - 每只持仓各自判断去留——这是固定日历轮动做不到的
#
# 与 self_managed_time 的对比见 strategy_guide.md §4.7。
# ===========================================================================

name: self_managed_rank
strategy: strategies.examples.self_managed_rank:SelfManagedRank

# ── 因子引用 ─────────────────────────────────────────────────────────────
factor_specs:
  - factor: mom20
    weight: 1.0
    ascending: false

# ── 过滤规则 ─────────────────────────────────────────────────────────────
filter_rules:
  exclude_st: true
  exclude_new_stock: true
  min_price: 3.0

# ── 条件单 ───────────────────────────────────────────────────────────────
conditions:
  stop_loss_pct: 0.08

# ── 策略配置 ─────────────────────────────────────────────────────────────
config:
  max_positions: 5
  top_k: 5
  min_hold_days: 15                # 最短持有天数，防止噪音调仓
  sell_rank_mult: 2.0              # 排名落到 top_k × 2 外才卖出
  commission_rate: 0.0002
  stamp_tax_rate: 0.0005
  slippage_ticks: 1
  execution_price: "open"

# ── 自管理换手 ───────────────────────────────────────────────────────────
# 换手由持仓排名变化自然触发。详见 strategy_guide.md §4.7。
